services:
  mysql:
    image: mysql:8.4
    container_name: field-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: field_service
      MYSQL_USER: field_user
      MYSQL_PASSWORD: field_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mysql_data: